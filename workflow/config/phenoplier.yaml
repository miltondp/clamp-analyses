phenoplier:
  conda_env: phenoplier-cli-neo

  version: 0.7.3

  workspace: ""

  namespace: clamp

  cohort: phenomexcan_rapid_gwas

  lv_percentile: 0.01

  trait_filter: phenomexcan-curated

  expected_phenotypes:
    phenomexcan-curated: 2824
    all: 4049

  saturation_k_values: [1728]

  trait_finals: [archs4, gtex]

  report_root: output/03_model_biology/02_archs4/05_traits

  workers:
    step6: 14
    blas_step6: 1
    step7: 14
    blas_step7: 1

  clusters:
    local:
      executor: local
    server_cu:
      executor: slurm
      cluster: cu-pico
    alpine:
      executor: slurm
      cluster: cu-alpine

  target: local

  resources:
    gls:
      threads: 14
      mem_mb: 100000
      runtime: 4320
    store:
      mem_mb: 32000
      runtime: 120

  # Reuse the delivered pico campaign by default. Recompute is opt-in.
  campaign:
    mode: recorded
    results_root: /pividori_lab/phenoplier_workspace/projects/marc/10-15-2026-trait-filtering-fix
    manifest: workflow/config/phenoplier_models.tsv
    source_root: .
    historical_root: data/phenoplier/historical_models
    output_root: output/03_model_biology/03_phenoplier/campaign
