phenoplier:
  conda_env: phenoplier-cli-neo

  version: 0.7.3

  workspace: ""

  namespace: clamp

  cohort: phenomexcan_rapid_gwas

  lv_percentile: 0.01

  trait_filter: phenomexcan-curated

  expected_phenotypes:
    biomedical: 2366
    phenomexcan-curated: 2824
    all: 4049

  saturation_k_values: [1728]

  trait_finals: [archs4, gtex]

  report_root: output/03_model_biology/02_archs4/05_traits

  workers:
    step6: 1
    blas_step6: 8
    step7: 6
    blas_step7: 2

  clusters:
    local:
      executor: local
    server_cu:
      executor: slurm
      cluster: cu-pico
    alpine:
      executor: slurm
      cluster: cu-alpine

  target: local

  resources:
    gls:
      threads: 12
      mem_mb: 100000
      runtime: 4320
    store:
      mem_mb: 32000
      runtime: 120
