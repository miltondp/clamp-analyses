archs4:
  raw_url: https://s3.dev.maayanlab.cloud/archs4/files/human_gene_v2.5.h5
  raw_h5: data/archs4/human_gene_v2.5.h5
  gene_lengths: data/archs4/gene_lengths.rds
  ensembl_version: 107

  technical_noise:
    compute_root: output/03_model_biology/02_archs4/06_technical_noise
    notebooks: nbs/03_model_biology/02_archs4/05_technical_noise
    ensembl_dir: data/archs4/technical_noise
    ensembl_urls:
      Homo_sapiens.GRCh38.107.gtf.gz: https://ftp.ensembl.org/pub/release-107/gtf/homo_sapiens/Homo_sapiens.GRCh38.107.gtf.gz
      Homo_sapiens.GRCh38.108.gtf.gz: https://ftp.ensembl.org/pub/release-108/gtf/homo_sapiens/Homo_sapiens.GRCh38.108.gtf.gz
      Homo_sapiens.GRCh38.cdna.all.fa.gz: https://ftp.ensembl.org/pub/release-107/fasta/homo_sapiens/cdna/Homo_sapiens.GRCh38.cdna.all.fa.gz
      Homo_sapiens.GRCh38.ncrna.fa.gz: https://ftp.ensembl.org/pub/release-107/fasta/homo_sapiens/ncrna/Homo_sapiens.GRCh38.ncrna.fa.gz

  paths:
    production: output/01_model_building/02_archs4
    biology: output/03_model_biology/02_archs4
    biology_notebooks: nbs/03_model_biology/02_archs4

  raw_data:
    block_size: 100
    n_cores: 10

  preprocess:
    mean_cutoff: 0.5
    var_cutoff: 0.1
    single_cell_probability_max: 0.5
    seed: 123

  svd:
    n_cores: 30
    seed: 123

  clamp:
    k_multiplier: 2
    multiplier: 100
    max_iter: 5000
    seed: 123

  prior:
    gmts:
      REACTOME: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
      GOCC: data/pathways/c5.go.cc.v2026.1.Hs.symbols.gmt
      C8: data/pathways/c8.all.v2026.1.Hs.symbols.gmt

  coverage:
    databases: [canonical, cellmarker]
    ora_root: output/01_model_building/02_archs4/02_coverage_study/ora
    assignments: output/03_model_biology/02_archs4/00_coverage/assignments
    seeds: [1, 2, 3]
    rng_seeds: [123, 124, 125]
    levels:
      "1": 00_bp_coverage_study_01
      "5": 01_bp_coverage_study_05
      "10": 02_bp_coverage_study_10
      "25": 03_bp_coverage_study_25
      "50": 04_bp_coverage_study_50
      "75": 05_bp_coverage_study_75
      "100": 06_bp_coverage_study_100
    input_root: output/01_model_building/02_archs4/02_coverage_study
    # At 100% every seed trains on the same studies, and CLAMPbase started from
    # the SVD is deterministic, so replicates 2-3 would duplicate replicate 1.
    # Coverage therefore fits them independently in their cells (replicate: RNG
    # seed): seeded randomized SVD with full_data_svd_k components, rank from
    # Gavish-Donoho x 2 and CLAMPbase with a seeded random start. The stability
    # workflow reuses these fits as its seeds 456 and 789.
    full_data_replicates: {"2": 456, "3": 789}
    full_data_svd_k: 4605
    resources:
      "1": {mem_mb: 32000, runtime: 5760}
      "5": {mem_mb: 64000, runtime: 8640}
      "10": {mem_mb: 96000, runtime: 14400}
      "25": {mem_mb: 224000, runtime: 24000}
      "50": {mem_mb: 192000, runtime: 36000}
      "75": {mem_mb: 288000, runtime: 48000}
      "100": {mem_mb: 320000, runtime: 54000}
    comparators:
      gtex:
        label: GTEx
        fbm_rds: output/01_model_building/01_gtex/gtex_fbm_filt.rds
        fbm_backing: output/01_model_building/01_gtex/FBMgtex_preproc_filtered.bk
        genes_rds: output/01_model_building/01_gtex/gtex_genes.rds
        samples_rds: output/01_model_building/01_gtex/gtex_samples.rds
        svd: output/01_model_building/01_gtex/gtex_svdRes.rds
        k: output/01_model_building/01_gtex/CLAMP_K_gtex.rds
        base: output/01_model_building/01_gtex/CLAMPbase.rds
        base_z: output/01_model_building/01_gtex/CLAMPbase/Z.csv
        # CLAMPbase replicates 2-3 (replicate: RNG seed), fitted by coverage with the
        # same design (scripts/gtex/fit_clampbase_seed.R) into
        # <replicate_root>/rs100_seed_<replicate>; the published model is replicate 1 (seed 0).
        replicate_root: output/01_model_building/02_archs4/02_coverage_study/comparators/gtex
        replicate_seeds: {"2": 456, "3": 789}
      recount2:
        label: recount2
        fbm_rds: output/01_model_building/03_recount2/00_recount2/recount2_fbm_filt.rds
        fbm_backing: output/01_model_building/03_recount2/00_recount2/FBMrecount2_preproc_filtered.bk
        genes_rds: output/01_model_building/03_recount2/00_recount2/recount2_genes.rds
        samples_rds: output/01_model_building/03_recount2/00_recount2/recount2_samples.rds
        svd: output/01_model_building/03_recount2/00_recount2/recount2_svdRes.rds
        k: output/01_model_building/03_recount2/00_recount2/CLAMP_K_recount2.rds
        base: output/01_model_building/03_recount2/00_recount2/CLAMPbase.rds
        base_z: output/01_model_building/03_recount2/00_recount2/CLAMPbase/Z.csv
    colors:
      model:
        CLAMPbase: "#777777"
      dataset:
        ARCHS4: "#0072B2"
        GTEx: "#E69F00"
        recount2: "#009E73"
    routing:
      remote_min_free_cpus: 2
      remote_min_free_mem_mb: 16000
      remote_max_ora_jobs: 8
      local_total_mem_mb: 96000
      retries: 2
      retry_mem_factors: [1.0, 1.5, 2.0]
      retry_mem_cap_mb: 800000
    final_datasets: [archs4, gtex, recount2]
    clampbase_root: output/98_final_models/clampbase
    clampbase_seed: {archs4: 1, gtex: 0, recount2: 0}
    clampbase_source:
      archs4:
        model: output/98_final_models/clampbase/archs4/CLAMPbase.rds
        z: output/98_final_models/clampbase/archs4/Z.csv
        b: output/98_final_models/clampbase/archs4/B.csv
      gtex:
        model: output/01_model_building/01_gtex/CLAMPbase.rds
        z: output/01_model_building/01_gtex/CLAMPbase/Z.csv
        b: output/01_model_building/01_gtex/CLAMPbase/B.csv
      recount2:
        model: output/01_model_building/03_recount2/00_recount2/CLAMPbase.rds
        z: output/01_model_building/03_recount2/00_recount2/CLAMPbase/Z.csv
        b: output/01_model_building/03_recount2/00_recount2/CLAMPbase/B.csv
    pathway:
      subsample_seeds: [123, 124, 125, 33, 1001, 1002, 1003, 1004, 1005, 1006]
      archs4_full_seeds: [123, 456, 789, 1001, 1002, 1003, 1004, 1005, 1006, 1007]
      gtex_seeds: [123, 456, 789, 1001, 1002, 1003, 1004, 1005, 1006, 1007]
      extended_svd: {"1": [1728]}

  stability:
    # Independent full-data ARCHS4 replicates: seeded randomized SVD, rank from
    # Gavish-Donoho x 2, CLAMPbase with a seeded random start and canonical CLAMPfull.
    # Together with coverage replicate 1 they
    # give ten full-data models. Seeds 456 and 789 are coverage 100% replicates 2-3:
    # their SVD and CLAMPbase come from the coverage cells and only CLAMPfull is fitted here.
    root: output/01_model_building/02_archs4/05_stability
    seeds: [456, 789, 1001, 1002, 1003, 1004, 1005, 1006, 1007]
    svd_k: 4605
    resources: {mem_mb: 400000, threads: 16, runtime: 10080}

  saturation:
    ora_root: output/01_model_building/02_archs4/01_saturation/ora
    seeds: [1, 2, 3]
    rng_seeds: [123, 124, 125]
    fractions: [1, 5, 10, 25, 50, 75]
    k_values: [86, 173, 432, 864, 1296, 1728]
    exclude_cells:
      - [1, 1728, 1]
    input_root: output/01_model_building/02_archs4/02_coverage_study
    input_levels:
      "1": 00_bp_coverage_study_01
      "5": 01_bp_coverage_study_05
      "10": 02_bp_coverage_study_10
      "25": 03_bp_coverage_study_25
      "50": 04_bp_coverage_study_50
      "75": 05_bp_coverage_study_75
    input_leaf: study_coverage_rs{fraction}_seed_{seed}
    base_root: output/01_model_building/02_archs4/01_saturation
    base_leaf: study_saturation_rs{fraction}_k{k}_seed_{seed}
    n_samples:
      "1": 6109
      "5": 30308
      "10": 60645
      "25": 152860
      "50": 303309
      "75": 454404
    resources:
      "1":
        "86": {mem_mb: 24000, runtime: 360}
        "173": {mem_mb: 24000, runtime: 360}
        "432": {mem_mb: 24000, runtime: 420}
        "864": {mem_mb: 24000, runtime: 420}
        "1296": {mem_mb: 24000, runtime: 600}
        "1728": {mem_mb: 24000, runtime: 900}
      "5":
        "86": {mem_mb: 24000, runtime: 420}
        "173": {mem_mb: 24000, runtime: 420}
        "432": {mem_mb: 32000, runtime: 420}
        "864": {mem_mb: 32000, runtime: 480}
        "1296": {mem_mb: 32000, runtime: 480}
        "1728": {mem_mb: 32000, runtime: 540}
      "10":
        "86": {mem_mb: 32000, runtime: 420}
        "173": {mem_mb: 40000, runtime: 420}
        "432": {mem_mb: 40000, runtime: 480}
        "864": {mem_mb: 40000, runtime: 540}
        "1296": {mem_mb: 48000, runtime: 600}
        "1728": {mem_mb: 48000, runtime: 720}
      "25":
        "86": {mem_mb: 64000, runtime: 420}
        "173": {mem_mb: 64000, runtime: 480}
        "432": {mem_mb: 72000, runtime: 600}
        "864": {mem_mb: 80000, runtime: 780}
        "1296": {mem_mb: 88000, runtime: 960}
        "1728": {mem_mb: 96000, runtime: 1200}
      "50":
        "86": {mem_mb: 104000, runtime: 480}
        "173": {mem_mb: 112000, runtime: 540}
        "432": {mem_mb: 120000, runtime: 780}
        "864": {mem_mb: 144000, runtime: 1200}
        "1296": {mem_mb: 160000, runtime: 1560}
        "1728": {mem_mb: 184000, runtime: 1980}
      "75":
        "86": {mem_mb: 152000, runtime: 480}
        "173": {mem_mb: 160000, runtime: 600}
        "432": {mem_mb: 176000, runtime: 960}
        "864": {mem_mb: 200000, runtime: 1560}
        "1296": {mem_mb: 232000, runtime: 2160}
        "1728": {mem_mb: 264000, runtime: 2760}
    routing:
      total_mem_mb: 675000
      fit_slots: 10
      ora_slots: 24
      threads_per_fit: 8
      retries: 2
      retry_mem_factors: [1.0, 1.5, 2.0]
      retry_mem_cap_mb: 675000

  traits:
    fdr: 0.05
    coverage:
      clampbase_dir: output/01_model_building/02_archs4/clampbase_coverage/summaries
      comparators_clampbase_dir: output/01_model_building/02_archs4/clampbase_coverage/comparators/gtex/summaries
    finals:
      clampbase_dir: output/01_model_building/02_archs4/clampbase_finals/summaries
    saturation:
      clampbase_dir: output/01_model_building/02_archs4/clampbase_saturation/summaries

  canonical:
    model_name: CLAMPfull_canonical
    final_root: output/98_final_models/clampfull/canonical
    compendia: [archs4, gtex, recount2]
    fits:
      archs4: {seed: 123, max_iter: 5000, mem_mb: 320000, runtime: 54000}
      gtex: {seed: 124, max_iter: 500, mem_mb: 96000, runtime: 2880}
      recount2: {seed: 124, max_iter: 500, mem_mb: 64000, runtime: 2880}
    ora:
      databases: [bp, canonical, reactome, cellmarker]

  drug_diseases:
    data_dir: data/drug_disease_associations
    drugbank_tsv: data/drug_disease_associations/drugbank.tsv
    drugbank_url: "https://raw.githubusercontent.com/dhimmel/drugbank/6b9ae386d6ba4a0eca2d66d4b0337a6e90fe81f4/data/drugbank.tsv"
    drugbank_sha256: 66050d51cb7a614ea6e951d630d2cf40893b75026ebe8f56c6cc37c0e73c3edd
    spredixcan_dir: data/phenomexcan/gene_assoc/spredixcan/pkl
    prior:
      c2_all: data/pathways/c2.all.v2026.1.Hs.symbols.gmt
      reactome: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
      cellmarker: data/pathways/Cell_marker_Human.xlsx
      sheet: human
      term_column: cell_name
      gene_column: Symbol
      output_gmt: output/01_model_building/02_archs4/03_drug_diseases_canonical/prior/canonical_reactome_cellmarker.gmt
    compute_root: output/01_model_building/02_archs4/03_drug_diseases_canonical
    report_root: output/03_model_biology/02_archs4/02_drug_diseases_canonical
    n_top_lvs: [5, 10, 25, 50]
    n_top_genes: [50, 100, 250, 500]
    methods:
      archs4_full: {label: ARCHS4 CLAMPfull, compendium: archs4, model: full}
      archs4_base: {label: ARCHS4 CLAMPbase, compendium: archs4, model: base}
      gtex_full: {label: GTEx CLAMPfull, compendium: gtex, model: full}
      gtex_base: {label: GTEx CLAMPbase, compendium: gtex, model: base}
      recount2_full: {label: recount2 CLAMPfull, compendium: recount2, model: full}
    comparison_methods: [archs4_full, archs4_base, gtex_full, gtex_base]
    bootstrap:
      n_boot: 10000
      seed: 42

  crispercas:
    # CRISPR-Cas9 lipid screen interpreted with metaLVs: LVs of the ten CLAMP-full
    # canonical models (S123 plus the stability seeds) clustered across seeds.
    lipid_deg: data/archs4/crispr_cas9/lipid_DEG.csv
    compute_root: output/03_model_biology/02_archs4/04_crispercas_ge4r015med
    metalv_root: output/03_model_biology/02_archs4/04_crispercas_ge4r015med/00_mgm
    noise_seeds_root: output/03_model_biology/02_archs4/06_technical_noise/seeds
    symbol_ensembl: output/03_model_biology/02_archs4/04_crispercas_ge4r015med/00_mgm/symbol_ensembl.csv
    min_cos: 0.5
    min_models: 4
    noise_r2: 0.15
    n_reps: 10
    fdr: 0.05
    top_n: 185
    fig5_candidates: [metaLV70, metaLV120, metaLV281, metaLV270, metaLV748, metaLV288, metaLV571, metaLV152]
    fig5_metalvs: [metaLV120, metaLV281, metaLV70, metaLV270]
    fig5_reference_genes: [SERPINA10, APOE, APOC1, LDLR, PCSK9, FADS2, ACSS2, HNF1B, HHEX]
    fig5_top_samples: {top_fraction: 0.01, min_pct: 5, n_boot: 1000, seed: 20261114}
    min_cases: 1000
    pathway_max_size: 100
    pathway_jaccard: 0.4
    lipid_regex: "LIPID|CHOLESTEROL|STEROL|FATTY|LIPOPROTEIN|TRIGLYCERIDE|EICOSANOID|PHOSPHOLIPID|BILE|PROSTAGLANDIN|LEUKOTRIENE|ARACHIDONIC|SPHINGO|PPAR|LDL|HDL"
    # PhenoPLIER GLS of all consensus ARCHS4 metaLVs (consensus_traits); the
    # selection recomputes BH over the GSEA-significant ones.
    gls_summary: output/98_final_models/consensus/archs4/traits/consensus_archs4.tsv.gz
    phenomexcan_dir: data/phenomexcan
    archs4_cell_lines_gmt: data/pathways/archs4_cell_lines.gmt
    archs4_cell_lines_url: "https://maayanlab.cloud/Enrichr/geneSetLibrary?mode=text&libraryName=ARCHS4_Cell-lines"
    archs4_cell_lines_max_size: 3000
    azimuth_gmt: data/pathways/Azimuth_2023.txt
    azimuth_url: "https://maayanlab.cloud/Enrichr/geneSetLibrary?mode=text&libraryName=Azimuth_2023"
    azimuth_min_size: 5
    azimuth_max_size: 3000
    smultixcan_zscores: data/archs4/drug_diseases_associations/smultixcan-mashr-zscores.pkl
    l1000_n_perm: 10000
    l1000_seed: 20261027

  ora:
    databases:
      bp:
        type: gmt
        path: data/pathways/go_bp.Hs.symbols.gmt
        label: GO Biological Process
      reactome:
        type: gmt
        path: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
        label: Reactome
      canonical:
        type: gmt
        path: data/pathways/c2.cp.v2026.1.Hs.symbols.gmt
        exclude_term_regex: ^REACTOME_
        label: Canonical non-Reactome
      cellmarker:
        type: cellmarker_xlsx
        path: data/pathways/Cell_marker_Human.xlsx
        sheet: human
        term_column: cell_name
        gene_column: Symbol
        label: CellMarker
    top_pct: 0.01
    min_size: 10
    max_size: 500
    pvalue_cutoff: 0.05
    qvalue_cutoff: 0.2
    fdr: [0.05]
    resources: {mem_mb: 8000, runtime: 60}


  final_models:
    clampbase:
      archs4: {root: output/98_final_models/clampbase/archs4, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
      gtex: {root: output/98_final_models/clampbase/gtex, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
      recount2: {root: output/98_final_models/clampbase/recount2, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
    clampfull:
      canonical:
        archs4: {root: output/98_final_models/clampfull/canonical/archs4, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: manifest.json}
        gtex: {root: output/98_final_models/clampfull/canonical/gtex, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: manifest.json}
        recount2: {root: output/98_final_models/clampfull/canonical/recount2, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: manifest.json}
