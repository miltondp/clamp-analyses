# Evaluation of consensus LVs (metaLVs) and ensemble clustering. See PLAN.md and
# scripts/consensus_eval/. Model order, top genes and ORA settings come from
# archs4.yaml / consensus.yaml; only what is new lives here.
consensus_eval:
  root: output/03_model_biology/02_archs4/07_consensus_eval   # {root}/{compendium}/...
  notebooks: nbs/03_model_biology/02_archs4/06_consensus_eval
  compendia:
    archs4:
      rds: data/clamp_archs4/CLAMPfull_canonical_seed{seed}.rds
      md5: data/clamp_archs4/MD5SUM.txt
      reference_dir: data/legacy_archs4/canonical_{model}   # staged copy of the con_ref model, for the export byte check
      legacy_flags: data/legacy_archs4/consensus_6reps/noise_flags.csv   # re-thresholded by cev_flags
      legacy_flags_r2: 0.25   # noise_r2 the legacy flags were written at
      genes: 18423
  # Frozen legacy sets, rebuilt with the unchanged cluster_metalv.py and checked against
  # their external Z (max|dZ| < reproduce_tol, same names) and legacy member lists.
  reproduce_tol: 1.0e-6
  reproduce:
    cl_c050_m4_r015: {linkage: complete, min_cos: 0.5, min_models: 4, noise_r2: 0.15,
                      external: data/clamp_archs4/consensus/Z_4reps.csv,
                      members: data/legacy_archs4/consensus_4reps/mgm_mapping.csv}
    cl_c050_m6_r025: {linkage: complete, min_cos: 0.5, min_models: 6, noise_r2: 0.25,
                      external: data/clamp_archs4/consensus/Z_6reps.csv,
                      members: data/legacy_archs4/consensus_6reps/mgm_mapping.csv}
  # Grids: the .smk expands each into set names ({grid}_{linkage}_{dist initial}{min_<dist>}_f{min_frac}_r{noise_r2}_{combine},
  # e.g. hier_complete_c050_f04_r015_median) and resolves min_models = ceil(min_frac x runs in the subset). The reproduce sets above are also
  # built by cev_hier_set (absolute min_models) and checked against the cluster_metalv.py output.
  # topj: the same machinery on 1 - Jaccard of each LV's top-n positive genes (crispercas.top_n),
  # named topj_{linkage}_j{min_jac}_f{min_frac}_r{noise_r2}_{combine}. 0.05 is the loosest cut above
  # the gene-shuffled null (max 0.036); reciprocal cos >= 0.5 hits have Jaccard p25/p50/p75 0.14/0.25/0.40.
  # A grid may be a list of grids (same prefix). The second hier entry is the grid twin of
  # cl_c050_m6_r025 (Z_6reps: 0.6 x 10 runs = 6), so the old published set gets split-half / LORO scores.
  grids:
    hier:
      - {dist: [cos], linkage: [complete, average], min_cos: [0.4, 0.5, 0.6, 0.7],
         min_frac: [0.3, 0.4, 0.5, 0.6], noise_r2: [0.15], combine: [median]}
      - {dist: [cos], linkage: [complete], min_cos: [0.5], min_frac: [0.6], noise_r2: [0.25], combine: [median]}
    topj: {dist: [jac], linkage: [complete, average], min_jac: [0.05, 0.1, 0.15, 0.2, 0.3],
           min_frac: [0.3, 0.4, 0.5, 0.6], noise_r2: [0.15], combine: [median]}
  eval:
    pool_r2: 0.15          # coverage/recall pool, the same for every set whatever its build noise_r2
    cos_thresholds: [0.5, 0.7, 0.9]
    # Reproducible pool LV: a reciprocal best hit with cosine >= cos and top-gene Jaccard above the
    # jac_null_q quantile of a gene-shuffled null (null_pairs run pairs, null_seed) in enough other
    # runs that, with its own run, they span >= ceil(min_frac x runs).
    reproducible: {cos: 0.5, min_frac: 0.4, jac_null_q: 0.999, null_pairs: 3, null_seed: 3}
    single_gene: 0.5       # top1_share above which an LV counts as single-gene dominated (consensus and pool)
    # recall_multi_c0.9: recall over reproducible LVs that are not single-gene dominated (recall_c0.9
    # rewards recovering single-gene LVs, which the topj sets deliberately shed).
    # Robustness (PLAN 2.4), grid sets only. Split-half: n_splits seeded 5-vs-5 splits (half a always holds
    # the first model, so no split repeats); Hungarian match on cosine, matched at >= match_cos. LORO: one
    # subset per left-out run. Nulls: gene_perm shuffles the gene order within every pool LV (n_perm pseudo-
    # subsets geneperm{i}, seed + i) and rebuilds every set; label_perm shuffles run labels over each full cut.
    # match_jac: cut of the Jaccard-matched split-half / LORO scores (the symmetric twin of match_cos:
    # cosine matching favors cosine-built sets). 0.25 is the median top-gene Jaccard of reciprocal cos >= 0.5 hits.
    match_cos: 0.9
    match_jac: 0.25
    split_half: {n_splits: 10, seed: 1}
    loro: true
    nulls: {gene_perm: {n_perm: 1, seed: 2}, label_perm: {n_perm: 3, seed: 2}}
    headline: [n_lvs, median_overlap_to_consensus, frac_redundant_c0.5, recall_c0.9, recall_multi_c0.9,
               sh_share_c0.9_all, sh_share_c0.9_multi, sh_jshare_j0.25_all, sh_jshare_j0.25_multi,
               loro_recovery_c0.9_all, loro_recovery_j0.25_all]
  resources:
    export: {mem_mb: 16000, runtime: 30}   # readRDS peaks at ~12 GB
    zcache: {mem_mb: 16000, runtime: 30}
    set: {mem_mb: 16000, runtime: 60}       # as crispercas_metalv_cluster
    linkage: {mem_mb: 16000, runtime: 30, threads: 4}   # condensed distance 0.9 GB + linkage copy
    eval: {mem_mb: 16000, runtime: 60, threads: 4}
    check: {mem_mb: 4000, runtime: 30}     # zcache/reproduction checks and the report (peak ~2 GB)
