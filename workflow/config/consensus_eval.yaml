# Evaluation of consensus LVs (metaLVs) and ensemble clustering. See PLAN.md and
# scripts/consensus_eval/. Model order, top genes and ORA settings come from
# archs4.yaml / consensus.yaml; only what is new lives here.
consensus_eval:
  root: output/03_model_biology/02_archs4/07_consensus_eval   # {root}/{compendium}/...
  notebooks: nbs/03_model_biology/02_archs4/06_consensus_eval
  compendia:
    archs4:
      rds: data/clamp_archs4/CLAMPfull_canonical_seed{seed}.rds
      md5: data/clamp_archs4/MD5SUM.txt
      reference_dir: data/legacy_archs4/canonical_{model}   # staged copy of the con_ref model, for the export byte check
      legacy_flags: data/legacy_archs4/consensus_6reps/noise_flags.csv   # re-thresholded by cev_flags
      legacy_flags_r2: 0.25   # noise_r2 the legacy flags were written at
      genes: 18423
  # Frozen legacy sets, rebuilt with the unchanged cluster_metalv.py and checked against
  # their external Z (max|dZ| < reproduce_tol, same names) and legacy member lists.
  reproduce_tol: 1.0e-6
  reproduce:
    cl_c050_m4_r015: {linkage: complete, min_cos: 0.5, min_models: 4, noise_r2: 0.15,
                      external: data/clamp_archs4/consensus/Z_4reps.csv,
                      members: data/legacy_archs4/consensus_4reps/mgm_mapping.csv}
    cl_c050_m6_r025: {linkage: complete, min_cos: 0.5, min_models: 6, noise_r2: 0.25,
                      external: data/clamp_archs4/consensus/Z_6reps.csv,
                      members: data/legacy_archs4/consensus_6reps/mgm_mapping.csv}
  # Grids: the .smk expands each into set names (hier_{linkage}_c{min_cos}_f{min_frac}_r{noise_r2}_{combine})
  # and resolves min_models = ceil(min_frac x runs in the subset). The reproduce sets above are also
  # built by cev_hier_set (absolute min_models) and checked against the cluster_metalv.py output.
  grids:
    hier: {linkage: [complete, average], min_cos: [0.4, 0.5, 0.6, 0.7],
           min_frac: [0.3, 0.4, 0.5, 0.6], noise_r2: [0.15], combine: [median]}
  eval:
    pool_r2: 0.15          # coverage/recall pool, the same for every set whatever its build noise_r2
    cos_thresholds: [0.5, 0.7, 0.9]
    # Reproducible pool LV: a reciprocal best hit with cosine >= cos and top-gene Jaccard above the
    # jac_null_q quantile of a gene-shuffled null (null_pairs run pairs, null_seed) in enough other
    # runs that, with its own run, they span >= ceil(min_frac x runs).
    reproducible: {cos: 0.5, min_frac: 0.4, jac_null_q: 0.999, null_pairs: 3, null_seed: 3}
    headline: [n_lvs, median_overlap_to_consensus, frac_redundant_c0.5, recall_c0.9]
  resources:
    export: {mem_mb: 16000, runtime: 30}   # readRDS peaks at ~12 GB
    zcache: {mem_mb: 16000, runtime: 30}
    set: {mem_mb: 16000, runtime: 60}       # as crispercas_metalv_cluster
    linkage: {mem_mb: 16000, runtime: 30, threads: 4}   # condensed distance 0.9 GB + linkage copy
    eval: {mem_mb: 16000, runtime: 60, threads: 4}
    check: {mem_mb: 4000, runtime: 30}     # zcache/reproduction checks and the report (peak ~2 GB)
