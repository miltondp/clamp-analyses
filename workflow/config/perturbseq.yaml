perturbseq:
  # Perturb-seq regulator->target benchmark of the OneK1K (PBMC_1k1k) LVs; see PLAN.md.
  # Source: Ota et al. 2025 reprocessing of the Replogle 2022 K562 genome-wide CRISPRi screen.
  inputs_manifest: workflow/config/perturbseq_inputs.json
  output_root: output/03_model_biology/00_pseudobulk/07_perturbseq
  dataset: PBMC_1k1k
  # Each pseudobulk strategy has its own gene universe, so regulons are built per strategy.
  # Z.csv roots come from paths.production (main) and donor_bulk.paths.production (perturbseq.smk).
  strategies:
    main:
      models: [CLAMPfull, CLAMPbase, PLIER, PCA, NMF, ICA, flashier, MOFA_FLEX_PRIOR, GSS, CoGAPS]
    donor_bulk:
      models: [CLAMPfull]
  seed: 123
  n_perm: 100
  regulons: {q: 0.05, min_size: 10, max_size: 1000, jaccard: 0.5}
  # Response capture (response_capture.py): perturbations with >= min_de DE genes in the universe;
  # captured when the permutation p of max |r| over LVs is <= alpha. remove_pcs: numbers of shared
  # logFC components (the common K562 knockdown response) to project out; 0 is the raw response.
  response:
    min_de: 20
    alpha: 0.05
    remove_pcs: [0, 1, 2]
    resources: {mem_mb: 8000, runtime: 60}
  # aucodds / F-aucodds (module_scores.py; Saelens et al. 2018). Each LV tail gives a `top` module
  # (the ORA query, ora.top_pct) and a `zscore` module (beyond zscore_sd SDs). Modules below min_size
  # genes are dropped; ORs with Holm-Sidak q > q are set to 0; log10 OR cutoffs span [0, log10_or_max].
  modules:
    zscore_sd: 3
    min_size: 5
    q: 0.05
    log10_or_max: 3
    resources: {mem_mb: 8000, runtime: 60}
  # Same ORA settings as the ARCHS4 meta-LV ORA (archs4.yaml: archs4.ora).
  ora:
    top_pct: 0.01
    pvalue_cutoff: 0.05
    qvalue_cutoff: 0.2
    fdr: 0.05
    database: k562gw_regulons
    database_label: K562 genome-wide CRISPRi regulons (Ota 2025)
    # run_ora.R: one clusterProfiler::enricher call per LV (MOFA-FLEX has 662 LVs).
    resources: {mem_mb: 8000, runtime: 120}
    # ora_null.py: n_perm permutations x 2 tails, vectorized over LVs.
    null_resources: {mem_mb: 8000, runtime: 60}

# Optional: root of an already-extracted copy of the Ota et al. release (the folder that holds
# data/Perturbseq/...). Verified files are symlinked instead of downloading the 7.7 GB ZIP.
# Set it per run: --config perturbseq_source_root=/path/to/extracted
perturbseq_source_root: ""
